# DOGEstonia — OpenAPI subset for Custom GPT Actions (Story Intake runtime).
#
# Auth (ChatGPT -> Configure -> Actions): API Key -> Bearer = server GPT_ACTIONS_BEARER_SECRET.
# servers.url: replace with public HTTPS origin of DOGEstonia Bot API when deployed.
#
# STATUS: CONTRACT CANDIDATE — lock paths/schemas to node GET /openapi.json when available.
# SSOT companion: GPT UI/instructions/story-api-methods-reference.md
# Lockstep: doge-complaints-gateway/src/core/intake/contracts.py (m2.story_intake_envelope.v2 + REQ-42/43 behavioral blocks)
#
openapi: 3.1.0
info:
  title: DOGEstonia Bot API — Story Intake (Custom GPT Actions, draft)
  version: "0.5.0"
  description: >
    Minimal subset for GPT Actions targeting story intake runtime (wire contract v2 + REQ-23 behavioral extensions).
    GPT-SUBMIT-01 (GIM-190): user citizen path — POST /story-drafts (stash) only; postStoryIntake removed from Actions.
    All operations use Bearer when GPT_ACTIONS_BEARER_SECRET is set.
    Lockstep: operationId/method/path/request/response/auth/version parity with story-api-methods-reference.md.
    VERSION DUAL-TRACKING: this file tracks GPT behavioral contract version (0.5.0); the runtime server
    tracks its own implementation version (currently 0.1.0 at GET /openapi.json). These are separate versioning
    axes and are NOT expected to be equal. Increment this version when operationId/method/path/required fields/
    response envelope/auth semantics change (see story-api-methods-reference.md §4 lockstep policy).

servers:
  - url: https://dogestonia-tallinn.up.railway.app
    description: DOGEstonia node public origin (no trailing path). DO NOT import from live GET /openapi.json — FastAPI auto-generated schema omits request body, uses wrong operationId and HTTP 200 instead of 202, and has no security scheme. This hand-crafted YAML is the authoritative GPT Actions import artifact.

security:
  - GptActionsBearer: []

components:
  securitySchemes:
    GptActionsBearer:
      # corresponds to server BearerAuth / Authorization: Bearer <token>
      type: http
      scheme: bearer
      description: >
        Shared secret = GPT_ACTIONS_BEARER_SECRET on the API host. Same value as ChatGPT Actions API Key (Bearer).
        Custom headers (e.g. X-User-Id) are typically NOT available from Actions — see gpt-actions-bot-api-auth-mapping.md.
        Current model is app-level integration bearer (no per-user OAuth identity claims in this schema).

  schemas:
    I18nText:
      type: object
      required: [et, ru, en]
      properties:
        et:
          type: string
        ru:
          type: string
        en:
          type: string

    Submitter:
      type: object
      description: >
        Omit entire block on user stash path (postStoryDraftStash) — author resolved at browser submit via identity /me (GW-DRAFT-02).
        Include only for service seed/sim direct POST /intake/stories scripts (not GPT Actions).
      properties:
        external_user_id:
          type: string
        identity_issuer:
          type: string
          description: >
            Namespace of submitter identity source. Demo GPT: dogestonia.gpt.v1 (REQ-22).

    Narrative:
      type: object
      required:
        - original_text
        - language
        - session_language
        - title
        - description
      properties:
        original_text:
          type: string
        language:
          type: string
          enum: [et, ru, en]
          description: Auto-detected language of user narrative input (detected_input_language).
        session_language:
          type: string
          enum: [et, ru, en]
          description: Primary session / UI language from normalization_metadata.session_language.
        title:
          $ref: "#/components/schemas/I18nText"
        description:
          $ref: "#/components/schemas/I18nText"
        summary:
          allOf:
            - $ref: "#/components/schemas/I18nText"
          nullable: true
          description: >
            Omit entire block if any et/ru/en slot is empty (REQ-25). Do not send null — omit the key.
        location_query:
          type: string
          nullable: true
        canonical_type:
          type: string
          nullable: true
        canonical_labels:
          type: array
          items:
            type: string
        institution:
          allOf:
            - $ref: "#/components/schemas/I18nText"
          nullable: true
          description: >
            DEMO SCOPE: always omit — do not populate (REQ-28 pre-flight #7; gate lifted by REQ-43).
            Post-demo: include only when all et/ru/en are non-empty (REQ-23 §2.5 / REQ-43).
            Omit the key; do not send null.

    GptSignals:
      type: object
      description: GPT classification signals (REQ-42 / REQ-23 §2).
      properties:
        severity:
          type: string
          enum: [LOW, MEDIUM, HIGH, CRITICAL]
        impact_estimation:
          type: string
          enum: [LOCAL, DISTRICT, CITY, NATIONAL]
        problem_status:
          type: string
          enum: [ONGOING, RESOLVED, RECURRING, UNKNOWN]

    Origin:
      type: object
      properties:
        source:
          type: string
          nullable: true
        conversation_id:
          type: string
          nullable: true
        tool_call_id:
          type: string
          nullable: true

    Privacy:
      type: object
      properties:
        contains_pii:
          type: boolean
          default: false
        redaction_requested:
          type: boolean
          default: false

    LiveStoryContext:
      type: object
      properties:
        consistency_notes:
          type: string
          nullable: true

    StoryIntakeRequest:
      type: object
      required: [schema_version, narrative]
      properties:
        schema_version:
          type: string
          enum: [m2.story_intake_envelope.v2]
          description: >
            Wire contract version (required). Shown in operator God Mode preview; minimize
            citizen-facing discussion per api-orchestrator §5.2.0b (REQ-31).
        submitter:
          $ref: "#/components/schemas/Submitter"
          description: >
            Omit on user stash (GIM-191). Not required for postStoryDraftStash.
        narrative:
          $ref: "#/components/schemas/Narrative"
        origin:
          $ref: "#/components/schemas/Origin"
          description: >
            Optional traceability sidecar. Always include origin.source='openai_gpt_action' in
            every StoryIntakeRequest regardless of Citizen/God Mode. Do NOT omit from the API
            request body — "omit from citizen summaries" means do not display origin fields in
            the conversational preview, not that the block should be absent from the request.
            (REQ-32 / REQ-31 §2.5.3 display vs transport.)
        privacy:
          $ref: "#/components/schemas/Privacy"
        live_story_context:
          $ref: "#/components/schemas/LiveStoryContext"
        gpt_signals:
          $ref: "#/components/schemas/GptSignals"
          description: >
            Optional classification block (REQ-42). Use human labels in Citizen Mode; full block in God Mode.

    StoryDraftStashResponseData:
      type: object
      required: [draft_id]
      properties:
        draft_id:
          type: string
          description: Opaque draft id for SPA redirect (API_REFERENCE §6.8).

    SuccessEnvelope_StoryDraftStash:
      type: object
      required: [data, trace_id]
      properties:
        data:
          $ref: "#/components/schemas/StoryDraftStashResponseData"
        trace_id:
          type: string

    StoryIntakeResponseData:
      type: object
      required: [schema_version, story_id, status]
      properties:
        schema_version:
          type: string
          enum: [m2.story_intake_response.v1]
        story_id:
          type: string
        # GAP-YAML-04 cross-spec drift note (closed-from-gpt-side 2026-05-26).
        # Full server StoryLifecycleStatus enum (doge-complaints-gateway/src/core/domain/contracts.py:20-24) has 4 values:
        #   accepted, partial_ready, ready_for_profile, clustered.
        # For POST /intake/stories success response only TWO are reachable:
        #   - services.py:187 creates record as ACCEPTED;
        #   - services.py:276-285 immediately calls advance_story_readiness;
        #   - services.py:352-358 locks transition ACCEPTED -> READY_FOR_PROFILE | PARTIAL_READY before HTTP return;
        #   - handlers.py:214-220 returns final_story.lifecycle_status.value (post-advance) wrapped in SuccessEnvelope.
        # Gateway runtime YAML (doge-complaints-gateway/docs/runtime-docs/api-reference/openapi.yaml:405-406) uses weaker
        # `status: type: string` without enum — intentionally broader domain to accommodate future status values.
        # This Actions YAML enum is endpoint-scoped (narrowed to actual reachable success-response values) — see
        # GPT UI/docs/analysis/handoff-gateway-runtime-yaml-status-enum.md for full cross-spec analysis.
        status:
          type: string
          enum: [ready_for_profile, partial_ready]
          description: >
            Intake lifecycle status for POST /intake/stories success response (API_REFERENCE §6.5–6.6).
            Server never returns "received". Endpoint-scoped enum: full server StoryLifecycleStatus has 4 values
            (accepted, partial_ready, ready_for_profile, clustered) but ACCEPTED is always advanced
            (services.py:352-358) and CLUSTERED is post-cron — neither is reachable in this success envelope.
            Gateway runtime YAML uses weaker `type: string` without enum (GAP-YAML-04 cross-spec drift; see
            handoff-gateway-runtime-yaml-status-enum.md).

    SuccessEnvelope_StoryIntake:
      type: object
      required: [data, trace_id]
      properties:
        data:
          $ref: "#/components/schemas/StoryIntakeResponseData"
        trace_id:
          type: string

    ErrorEnvelope:
      type: object
      required: [error, trace_id]
      properties:
        error:
          type: object
          required: [code, type, message, details]
          properties:
            code:
              type: string
            type:
              type: string
            message:
              type: string
            details:
              type: object
              additionalProperties: true
        trace_id:
          type: string

paths:
  /story-drafts:
    post:
      operationId: postStoryDraftStash
      summary: Stash a story draft for browser submit
      description: >
        Stash the resident's validated StoryIntakeRequest after interview normalization and confirmation.
        Returns draft_id for SPA redirect — no story is created. Same service Bearer as legacy intake.
        User completes submit in browser (POST /story-drafts/{draft_id}/submit). Re-import Actions after bump.
      x-openai-isConsequential: true
      security:
        - GptActionsBearer: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/StoryIntakeRequest"
      responses:
        "201":
          description: Draft stashed; no story created.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SuccessEnvelope_StoryDraftStash"
        "400":
          description: Stash validation error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
        "401":
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
        "422":
          description: >
            Geo scope mismatch (GEO_SCOPE_MISMATCH) — location_query outside configured
            region. Schema/domain validation errors use HTTP 400, not 422.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
        "500":
          description: Internal server error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
