# DOGEstonia — OpenAPI subset for Custom GPT Actions (Story Intake runtime).
#
# Auth (ChatGPT -> Configure -> Actions): API Key -> Bearer = server GPT_ACTIONS_BEARER_SECRET.
# servers.url: replace with public HTTPS origin of DOGEstonia Bot API when deployed.
#
# STATUS: CONTRACT CANDIDATE — lock paths/schemas to node GET /openapi.json when available.
# SSOT companion: GPT UI/instructions/story-api-methods-reference.md
# Lockstep: doge-complaints-gateway/src/core/intake/contracts.py (m2.story_intake_envelope.v2 + REQ-42/43 behavioral blocks)
#
openapi: 3.1.0
info:
  title: DOGEstonia Bot API — Story Intake (Custom GPT Actions, draft)
  version: "0.7.0"
  description: >
    Minimal subset for GPT Actions targeting story intake runtime (wire contract v2 + REQ-23 behavioral extensions).
    GPT-SUBMIT-02 (GIM-201): single stash contract — POST /story-drafts only; StoryDraftStashRequest (author at browser submit, GW-DRAFT-02).
    GPT-TAX-01 (GIM-209): narrative.taxonomy per-axis SoT; canonical_labels deprecated/derived flat compat.
    GPT-TAX-02 (GIM-232): TaxonomyAxisEntry.label is an English snake_case / SSOT token — not et/ru prose; no vocabulary HTTP 422.
    All operations use Bearer when GPT_ACTIONS_BEARER_SECRET is set.
    Lockstep: operationId/method/path/request/response/auth/version parity with story-api-methods-reference.md.
    VERSION DUAL-TRACKING: this file tracks GPT behavioral contract version (0.7.0); the runtime server
    tracks its own implementation version (currently 0.1.0 at GET /openapi.json). These are separate versioning
    axes and are NOT expected to be equal. Increment this version when operationId/method/path/required fields/
    response envelope/auth semantics change (see story-api-methods-reference.md §4 lockstep policy).
    Axis/disposition enums lockstep with gateway GW-TAX-01 (TAXONOMY_AXIS_VALUES + LabelDisposition).

servers:
  - url: https://dogestonia-tallinn.up.railway.app
    description: DOGEstonia node public origin (no trailing path). DO NOT import from live GET /openapi.json — FastAPI auto-generated schema omits request body, uses wrong operationId and HTTP 200 instead of 202, and has no security scheme. This hand-crafted YAML is the authoritative GPT Actions import artifact.

security:
  - GptActionsBearer: []

components:
  securitySchemes:
    GptActionsBearer:
      # corresponds to server BearerAuth / Authorization: Bearer <token>
      type: http
      scheme: bearer
      description: >
        Shared secret = GPT_ACTIONS_BEARER_SECRET on the API host. Same value as ChatGPT Actions API Key (Bearer).
        Custom headers (e.g. X-User-Id) are typically NOT available from Actions — see gpt-actions-bot-api-auth-mapping.md.
        Current model is app-level integration bearer (no per-user OAuth identity claims in this schema).

  schemas:
    I18nText:
      type: object
      required: [et, ru, en]
      properties:
        et:
          type: string
        ru:
          type: string
        en:
          type: string

    TaxonomyAxisEntry:
      type: object
      required: [label, disposition]
      description: >
        One label on a taxonomy axis (GPT-TAX-01 / D-TAX-1). disposition lockstep with gateway
        LabelDisposition: canonical | metadata_only | needs_clarification | rejected | internal.
      properties:
        label:
          type: string
          description: >
            English snake_case / taxonomy-SSOT token (GPT-TAX-02). Estonian or Russian
            prose is not a wire label value. Not an HTTP 422 / server vocabulary enum.
        disposition:
          type: string
          enum:
            - canonical
            - metadata_only
            - needs_clarification
            - rejected
            - internal
          description: >
            Wire disposition. internal = §6 internal-only labels (gateway filters from public surfaces).

    NarrativeTaxonomy:
      type: object
      description: >
        Per-axis taxonomy source of truth (GPT-TAX-01). Keys = TAXONOMY_AXIS_VALUES (13 axes,
        gateway axes.py). Each axis maps to an array of TaxonomyAxisEntry. Omit empty axes.
        Do not collapse axes into a flat list — axis membership is preserved on the wire.
      properties:
        topic_domain:
          type: array
          items:
            $ref: "#/components/schemas/TaxonomyAxisEntry"
        service_object:
          type: array
          items:
            $ref: "#/components/schemas/TaxonomyAxisEntry"
        location_context:
          type: array
          items:
            $ref: "#/components/schemas/TaxonomyAxisEntry"
        failure_mode:
          type: array
          items:
            $ref: "#/components/schemas/TaxonomyAxisEntry"
        issue_archetype_support:
          type: array
          items:
            $ref: "#/components/schemas/TaxonomyAxisEntry"
        affected_scope:
          type: array
          items:
            $ref: "#/components/schemas/TaxonomyAxisEntry"
        civic_signal:
          type: array
          items:
            $ref: "#/components/schemas/TaxonomyAxisEntry"
        deep_need:
          type: array
          items:
            $ref: "#/components/schemas/TaxonomyAxisEntry"
        desired_outcome:
          type: array
          items:
            $ref: "#/components/schemas/TaxonomyAxisEntry"
        ecosystem_signal:
          type: array
          items:
            $ref: "#/components/schemas/TaxonomyAxisEntry"
        governance_signal:
          type: array
          items:
            $ref: "#/components/schemas/TaxonomyAxisEntry"
        risk_privacy_safety:
          type: array
          items:
            $ref: "#/components/schemas/TaxonomyAxisEntry"
        confidence_state:
          type: array
          items:
            $ref: "#/components/schemas/TaxonomyAxisEntry"
      additionalProperties: false

    Narrative:
      type: object
      required:
        - original_text
        - language
        - session_language
        - title
        - description
      properties:
        original_text:
          type: string
        language:
          type: string
          enum: [et, ru, en]
          description: Auto-detected language of user narrative input (detected_input_language).
        session_language:
          type: string
          enum: [et, ru, en]
          description: Primary session / UI language from normalization_metadata.session_language.
        title:
          $ref: "#/components/schemas/I18nText"
        description:
          $ref: "#/components/schemas/I18nText"
        summary:
          allOf:
            - $ref: "#/components/schemas/I18nText"
          nullable: true
          description: >
            Omit entire block if any et/ru/en slot is empty (REQ-25). Do not send null — omit the key.
        location_query:
          type: string
          nullable: true
        canonical_type:
          type: string
          nullable: true
        taxonomy:
          $ref: "#/components/schemas/NarrativeTaxonomy"
          description: >
            GPT-TAX-01 / D-TAX-1 source of truth for labels by axis. Prefer this over
            canonical_labels. Gateway parse_taxonomy_payload consumes this object.
        canonical_labels:
          type: array
          items:
            type: string
          deprecated: true
          description: >
            DEPRECATED / DERIVED (GPT-TAX-01): flat list of disposition=canonical label keys
            only, derived from narrative.taxonomy when present. Per-axis taxonomy is SoT.
            Kept for backward compatibility with older consumers. Prefer taxonomy.
        institution:
          allOf:
            - $ref: "#/components/schemas/I18nText"
          nullable: true
          description: >
            DEMO SCOPE: always omit — do not populate (REQ-28 pre-flight #7; gate lifted by REQ-43).
            Post-demo: include only when all et/ru/en are non-empty (REQ-23 §2.5 / REQ-43).
            Omit the key; do not send null.

    GptSignals:
      type: object
      description: GPT classification signals (REQ-42 / REQ-23 §2).
      properties:
        severity:
          type: string
          enum: [LOW, MEDIUM, HIGH, CRITICAL]
        impact_estimation:
          type: string
          enum: [LOCAL, DISTRICT, CITY, NATIONAL]
        problem_status:
          type: string
          enum: [ONGOING, RESOLVED, RECURRING, UNKNOWN]

    Origin:
      type: object
      properties:
        source:
          type: string
          nullable: true
        conversation_id:
          type: string
          nullable: true
        tool_call_id:
          type: string
          nullable: true

    Privacy:
      type: object
      properties:
        contains_pii:
          type: boolean
          default: false
        redaction_requested:
          type: boolean
          default: false

    LiveStoryContext:
      type: object
      properties:
        consistency_notes:
          type: string
          nullable: true

    StoryDraftStashRequest:
      type: object
      required: [schema_version, narrative]
      properties:
        schema_version:
          type: string
          enum: [m2.story_intake_envelope.v2]
          description: >
            Wire contract version (required). Shown in operator God Mode preview; minimize
            citizen-facing discussion per api-orchestrator §5.2.0b (REQ-31).
        narrative:
          $ref: "#/components/schemas/Narrative"
        origin:
          $ref: "#/components/schemas/Origin"
          description: >
            Optional traceability sidecar. Always include origin.source='openai_gpt_action' in
            every StoryDraftStashRequest regardless of Citizen/God Mode. Do NOT omit from the API
            request body — "omit from citizen summaries" means do not display origin fields in
            the conversational preview, not that the block should be absent from the request.
            (REQ-32 / REQ-31 §2.5.3 display vs transport.)
        privacy:
          $ref: "#/components/schemas/Privacy"
        live_story_context:
          $ref: "#/components/schemas/LiveStoryContext"
        gpt_signals:
          $ref: "#/components/schemas/GptSignals"
          description: >
            Optional classification block (REQ-42). Use human labels in Citizen Mode; full block in God Mode.
      description: >
        GPT Actions stash request body. Author resolved at browser submit (GW-DRAFT-02).

    StoryDraftStashResponseData:
      type: object
      required: [draft_id]
      properties:
        draft_id:
          type: string
          description: Opaque draft id for SPA redirect (API_REFERENCE §6.8).

    SuccessEnvelope_StoryDraftStash:
      type: object
      required: [data, trace_id]
      properties:
        data:
          $ref: "#/components/schemas/StoryDraftStashResponseData"
        trace_id:
          type: string

    ErrorEnvelope:
      type: object
      required: [error, trace_id]
      properties:
        error:
          type: object
          required: [code, type, message, details]
          properties:
            code:
              type: string
            type:
              type: string
            message:
              type: string
            details:
              type: object
              additionalProperties: true
        trace_id:
          type: string

paths:
  /story-drafts:
    post:
      operationId: postStoryDraftStash
      summary: Stash a story draft for browser submit
      description: >
        Stash the resident's validated StoryDraftStashRequest after interview normalization and confirmation.
        Returns draft_id for SPA redirect — no story is created. User completes submit in browser
        (POST /story-drafts/{draft_id}/submit). Re-import Actions after contract bump.
      x-openai-isConsequential: true
      security:
        - GptActionsBearer: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/StoryDraftStashRequest"
      responses:
        "201":
          description: Draft stashed; no story created.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SuccessEnvelope_StoryDraftStash"
        "400":
          description: Stash validation error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
        "401":
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
        "422":
          description: >
            Geo scope mismatch (GEO_SCOPE_MISMATCH) — location_query outside configured
            region. Schema/domain validation errors use HTTP 400, not 422.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
        "500":
          description: Internal server error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
